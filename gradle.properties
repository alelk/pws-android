
#Kotlin
kotlin.code.style=official
# G1 (not the default ParallelGC) so the idle Kotlin daemon gives memory back before the test tasks.
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseG1GC -XX:G1PeriodicGCInterval=10000

#Gradle
# Private-repo GitHub runner = 2 vCPU / ~7 GB total: Gradle + Kotlin daemon + test JVMs share it.
# MaxMetaspaceSize is explicit on purpose (auto-sizing under-provisions it on CI).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true