appId: ${APP_ID}
name: "NN - <one line: what boundary this flow proves>"
---
# Kind: mutation            (smoke = read-only, no clearState; diagnostic = in no suite)
# Precondition: release APK of the flavor under test; clean state via cold-start.
# Why this is E2E and not a ViewModel test: <the artifact-level risk it covers>.

- runFlow: _helpers/cold-start.yaml

# Setup the data this flow needs — never rely on another flow's leftovers.
- tapOn:
    id: "${NAV_SEARCH}"
- extendedWaitUntil:
    visible:
      id: "${FIELD_SEARCH}"
    timeout: ${TIMEOUT_MEDIUM}

# Act
- tapOn:
    id: "${FIELD_SEARCH}"
- inputText: "${SEARCH_QUERY_NUMERIC}"

# Anything that may have focused a text field, before a bottom-nav tap:
- runFlow: _helpers/dismiss-keyboard.yaml

# End on a POSITIVE assertion — something only the expected screen has.
- extendedWaitUntil:
    visible:
      id: "${SONG_ITEM_ONE}"
    timeout: ${TIMEOUT_LONG}
- assertVisible:
    id: "${SONG_ITEM_ONE}"

- takeScreenshot: "${SCREENSHOTS_DIR}/NN-name"
