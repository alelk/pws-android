name: Image

# Rebuilds the image of an EXISTING release from its attached artifacts — e.g. after the base-image
# digest in deploy/Dockerfile was refreshed and no new release is due. The normal publication is the
# `Publish image` step of ci.yml, in the job that makes the release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag, e.g. v1.2.3 or v1.3.0-rc.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate the tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}   # via env, never interpolated into the script
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "not a release tag: $RELEASE_TAG" >&2; exit 1; }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Download the release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p 'app-*.jar' -p webapp.tar.gz --dir artifacts

      - name: Image context from the release artifacts
        id: image_context
        run: |
          meta="$(deploy/bin/image-context.sh artifacts/app-*.jar artifacts/webapp.tar.gz build/image-context)"
          echo "meta=${meta}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: build/image-context
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BUILD_META=${{ steps.image_context.outputs.meta }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha
