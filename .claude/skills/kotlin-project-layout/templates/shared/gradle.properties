# Kotlin daemon. NB: the key is `kotlin.daemon.jvmargs` — `kotlin.daemon.jvm.options` does not
# exist and is silently ignored. A wasmJs build (DCE + wasm-opt) needs more heap than JVM-only.
# G1, not the daemon's default ParallelGC: Parallel never returns committed heap, so after the
# heaviest compile (the production wasm link) the daemon keeps its whole -Xmx for the rest of the
# build — through every test task. G1's periodic collection gives back what the idle daemon no
# longer uses; the ceiling is unchanged. (Naming any GC here drops the daemon's default one.)
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC -XX:G1PeriodicGCInterval=10000

# How many Test tasks of different modules run at once (TestSlots.kt in convention-plugins).
# Compilation stays fully parallel; only test JVMs queue. Raise with -P on a big machine.
app.maxParallelTestTasks=2

# Gradle daemon (its own JVM, separate from the Kotlin daemon above). Set BOTH -Xmx and
# -XX:MaxMetaspaceSize explicitly — do not rely on Gradle's "smart default" auto-sizing, which
# has been observed to under-size Metaspace on a GitHub Actions runner (512m heap / 384m
# Metaspace on a project with several modules + Detekt/ktlint/Compose plugins loaded into one
# daemon). The failure doesn't look like an OOM: the daemon logs "Daemon will be stopped at the
# end of the build after running out of JVM Metaspace" mid-build, then the CI job ends with a
# bare "Error: The operation was canceled." with no Gradle stack trace to grep for. If that
# happens again, raise MaxMetaspaceSize first — it is almost never the heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC

# Incremental compilation
kotlin.incremental=true
kotlin.incremental.js=true

# Parallel execution + build cache
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache: recommended for new projects. Turn it on once `./gradlew build
# --configuration-cache` passes with every plugin you use; leave a comment naming the blocker
# if one plugin is not compatible yet.
# org.gradle.configuration-cache=true

# Suppress warnings about experimental KMP features
kotlin.mpp.stability.nowarn=true
