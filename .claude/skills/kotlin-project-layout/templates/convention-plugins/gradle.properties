# `kotlin-dsl` compiles the convention plugins with Gradle's EMBEDDED Kotlin — a different version
# from the project's. Out of process that starts a SECOND Kotlin daemon ("Detected multiple Kotlin
# daemon sessions" in the log), sized by the Gradle daemon's -Xmx (this build has no
# kotlin.daemon.jvmargs), which then idles for the whole build holding ~1–1.5 GB. A dozen small
# scripts compile inside the Gradle daemon in seconds.
kotlin.compiler.execution.strategy=in-process
