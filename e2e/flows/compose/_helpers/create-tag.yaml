appId: ${APP_ID}
name: "_helper: create tag TEST_TAG_NAME"
---
# Reusable subflow. From any screen, navigates to Library → Tags section, opens
# the create-tag dialog, types TEST_TAG_NAME, saves, then scrolls the tag list
# until the new tag becomes visible. Leaves the app on the Tags section.

# The caller may arrive with the search field focused (e.g. after backing out of
# a song opened via Search) — the soft keyboard then covers the bottom nav bar
# and hides NAV_LIBRARY. Dismiss it first so the tab is reachable.
- runFlow: dismiss-keyboard.yaml

- tapOn:
    id: "${NAV_LIBRARY}"

- extendedWaitUntil:
    visible:
      id: "${LIBRARY_SECTION_TAGS}"
    timeout: ${TIMEOUT_MEDIUM}

- tapOn:
    id: "${LIBRARY_SECTION_TAGS}"

- extendedWaitUntil:
    visible:
      id: "${ACTION_ADD_TAG}"
    timeout: ${TIMEOUT_MEDIUM}

- tapOn:
    id: "${ACTION_ADD_TAG}"

- extendedWaitUntil:
    visible:
      id: "${FIELD_TAG_NAME}"
    timeout: ${TIMEOUT_MEDIUM}

- tapOn:
    id: "${FIELD_TAG_NAME}"
- inputText: "${TEST_TAG_NAME}"

- assertVisible: "${TEST_TAG_NAME}"

- tapOn:
    id: "${ACTION_SAVE_TAG}"

# Wait for return to the Tags list — Add FAB is visible there.
- extendedWaitUntil:
    visible:
      id: "${ACTION_ADD_TAG}"
    timeout: ${TIMEOUT_MEDIUM}

# Tag may be below the predefined ones — scroll to it.
- scrollUntilVisible:
    element: "${TEST_TAG_NAME}"
    direction: DOWN
    timeout: ${TIMEOUT_LONG}
    speed: 80

- assertVisible: "${TEST_TAG_NAME}"
