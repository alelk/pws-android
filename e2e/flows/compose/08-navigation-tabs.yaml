appId: ${APP_ID}
name: "08 - Navigation tabs - all tabs reachable"
---
# Visits every bottom-nav tab in sequence and asserts each loads.
# 4 tabs: Home / Books / Search / Library (Library contains Favorites, History, Tags sections).
# 100% locale-independent: navigation by contentDescription = route / testTag.

- launchApp:
    clearState: false

# Search tab
- tapOn:
    id: "${NAV_SEARCH}"
- extendedWaitUntil:
    visible:
      id: "${FIELD_SEARCH}"
    timeout: ${TIMEOUT_MEDIUM}

# Search auto-focuses its field, so the soft keyboard can cover the bottom nav bar —
# the Home tab then drops out of the hierarchy entirely.
- runFlow: _helpers/dismiss-keyboard.yaml
- tapOn:
    id: "${NAV_HOME}"
- extendedWaitUntil:
    visible:
      id: "${FIELD_HOME_SEARCH}"
    timeout: ${TIMEOUT_MEDIUM}

# Books tab
- tapOn:
    id: "${NAV_BOOKS}"
# BookLibrary first-launch screen may appear — dismiss it if so.
- runFlow:
    when:
      visible:
        id: "${ACTION_NAVIGATE_BACK}"
    commands:
      - tapOn:
          id: "${ACTION_NAVIGATE_BACK}"
- extendedWaitUntil:
    visible:
      id: "books-grid"
    timeout: ${TIMEOUT_LONG}

# Library tab — default section is Favorites
- tapOn:
    id: "${NAV_LIBRARY}"
- extendedWaitUntil:
    visible:
      id: "${LIBRARY_SECTION_FAVORITES}"
    timeout: ${TIMEOUT_MEDIUM}

# Library → History section
- tapOn:
    id: "${LIBRARY_SECTION_HISTORY}"
- waitForAnimationToEnd

# Library → Tags section (verifies FAB appears)
- tapOn:
    id: "${LIBRARY_SECTION_TAGS}"
- extendedWaitUntil:
    visible:
      id: "${ACTION_ADD_TAG}"
    timeout: ${TIMEOUT_MEDIUM}

# Back to Home
- tapOn:
    id: "${NAV_HOME}"
- extendedWaitUntil:
    visible:
      id: "${NAV_HOME}"
    timeout: ${TIMEOUT_MEDIUM}

- takeScreenshot: "${SCREENSHOTS_DIR}/08-tab-home"
