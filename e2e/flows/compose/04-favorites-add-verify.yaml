appId: ${APP_ID}
name: "04 - Add to favorites and verify in Favorites list"
---
# Mutation: add song #1 to favorites, navigate to Favorites tab, assert visible.

- runFlow: _helpers/cold-start.yaml

- runFlow: _helpers/open-song-1-via-search.yaml

# Add to favorites.
- tapOn:
    id: "${ACTION_TOGGLE_FAVORITE}"

- back
# Back lands on the Search tab, which re-focuses its field and can reopen the keyboard
# over the bottom nav bar.
- runFlow: _helpers/dismiss-keyboard.yaml
- tapOn:
    id: "${NAV_LIBRARY}"

- extendedWaitUntil:
    visible:
      id: "${LIBRARY_SECTION_FAVORITES}"
    timeout: ${TIMEOUT_MEDIUM}

- tapOn:
    id: "${LIBRARY_SECTION_FAVORITES}"

- extendedWaitUntil:
    visible:
      id: "${SONG_ITEM_ONE}"
    timeout: ${TIMEOUT_LONG}

- assertVisible:
    id: "${SONG_ITEM_ONE}"

- takeScreenshot: "${SCREENSHOTS_DIR}/04-favorites-list"
