appId: ${APP_ID}
name: "10 - Settings screen opens and closes"
---
# Open Settings via Library tab → back → assert Library reachable.

- launchApp:
    clearState: false

- tapOn:
    id: "${NAV_LIBRARY}"

- extendedWaitUntil:
    visible:
      id: "${ACTION_OPEN_SETTINGS}"
    timeout: ${TIMEOUT_MEDIUM}

- tapOn:
    id: "${ACTION_OPEN_SETTINGS}"

# Settings is a separate screen; no stable testTag exists there yet,
# so we wait for the transition to settle and then assert we can get back.
- waitForAnimationToEnd

- back

- extendedWaitUntil:
    visible:
      id: "${NAV_LIBRARY}"
    timeout: ${TIMEOUT_MEDIUM}

- assertVisible:
    id: "${NAV_LIBRARY}"

- takeScreenshot: "${SCREENSHOTS_DIR}/10-settings-back"
