appId: ${APP_ID}
name: "15 - Search: empty results state"
---
# Submit a query that returns zero results; verify no crash and empty list.

- launchApp:
    clearState: false

- tapOn:
    id: "${NAV_SEARCH}"

- extendedWaitUntil:
    visible:
      id: "${FIELD_SEARCH}"
    timeout: ${TIMEOUT_MEDIUM}

- tapOn:
    id: "${FIELD_SEARCH}"
- inputText: "zzz999"
# Uncover the result area before asserting on it — the assertion below is
# `assertNotVisible`, so anything that hides the list would pass it for the wrong reason.
- runFlow: _helpers/dismiss-keyboard.yaml

- waitForAnimationToEnd

# Anchor first: prove we are still on the Search screen, so the empty-list assertion
# below can only pass because the query returned nothing.
- assertVisible:
    id: "${FIELD_SEARCH}"

- assertNotVisible:
    id: "${SONG_ITEM_ONE}"

- takeScreenshot: "${SCREENSHOTS_DIR}/15-empty-results"
