appId: ${APP_ID}
name: "01 - App launch and navigation ready"
---
# Verify the app starts without crash and all navigation tabs are reachable.
# On first launch (or after --clean) the onboarding screen appears; the helper
# installs the recommended book and proceeds to the main screen.

- launchApp:
    clearState: false

- waitForAnimationToEnd:
    timeout: 5000

- runFlow:
    when:
      visible:
        id: "${ACTION_SKIP_ONBOARDING}"
    file: _helpers/dismiss-onboarding.yaml

- extendedWaitUntil:
    visible:
      id: "${NAV_HOME}"
    timeout: ${TIMEOUT_COLD_START}

- assertVisible:
    id: "${NAV_HOME}"
- assertVisible:
    id: "${NAV_SEARCH}"
- assertVisible:
    id: "${NAV_BOOKS}"
- assertVisible:
    id: "${NAV_LIBRARY}"

- takeScreenshot: "${SCREENSHOTS_DIR}/01-app-launch-home"
